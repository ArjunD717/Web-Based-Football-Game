<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>22-player render benchmark</title>
<style>
  :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07100b; color: #dff7e7; }
  #stage, #stage canvas { display: block; width: 100%; height: 100%; }
  #panel { position: fixed; top: 18px; left: 18px; width: 360px; padding: 16px 18px; border: 1px solid rgba(154, 238, 189, .28); border-radius: 10px; background: rgba(4, 12, 8, .82); backdrop-filter: blur(8px); }
  h1 { margin: 0 0 4px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #9aeebd; }
  p { margin: 0 0 12px; font-size: 11px; line-height: 1.5; color: #8aa897; }
  #status { font-size: 12px; color: #f1c75b; margin-bottom: 10px; }
  #results { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; font-size: 12px; margin-bottom: 12px; }
  #results span:nth-child(even) { color: #9aeebd; text-align: right; }
  button { padding: 7px 10px; border: 1px solid #3e7053; border-radius: 6px; background: #10291b; color: #dff7e7; font: inherit; font-size: 11px; cursor: pointer; }
  button:hover { background: #173a26; }
  #note { margin-top: 10px; font-size: 10px; line-height: 1.45; color: #6f8c7b; }
</style>
</head>
<body>
<div id="stage"><canvas id="pitch"></canvas></div>
<section id="panel">
  <h1>22-player render benchmark</h1>
  <p>Authored rigs, high quality, broadcast camera. Warm-up first; the measurement starts automatically.</p>
  <div id="status">Warming up…</div>
  <div id="results"></div>
  <button id="rerun" type="button">Run again</button>
  <div id="note">CPU time around <code>renderer.render()</code>. GPU completion can be later; use the same device and window size for comparisons.</div>
</section>
<script type="module" src="/src/performance.ts"></script>
</body>
</html>
